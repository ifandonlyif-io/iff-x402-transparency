name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.6'
          cache-dependency-path: go/go.mod

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: ts/package-lock.json

      - name: Verify spec and reference verifier
        run: |
          python3 -B spec/verify_example.py --self-test
          python3 -B -m unittest discover -s spec -p 'test_*.py' -v
          python3 -m json.tool schemas/service-receipt-v1.json >/dev/null
          python3 -m json.tool schemas/service-receipt-key-directory-v1.json >/dev/null
          python3 -m json.tool spec/testdata/service_receipt_v1.json >/dev/null
          python3 -m json.tool keys/service-receipt-production-2026-09-01.json >/dev/null

      - name: Test browser receipt verifier core
        run: node --test browser/service-receipt.test.mjs

      - name: Test Go module
        working-directory: go
        run: |
          go mod verify
          go test ./...
          go vet ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Test TypeScript package
        working-directory: ts
        run: |
          npm ci
          npm test
          npm run build
          npm pack --dry-run
